app = "creole-dictionary"
primary_region = "dfw"

[env]
  DJANGO_ALLOWED_HOSTS = "creole-dictionary.fly.dev"
  DATABASE_URL = "sqlite:////data/dictionary.db"

[mounts]
  source = "dictionary_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"
    [http_service.checks.headers]
      X-Forwarded-Proto = "https"
      Host = "creole-dictionary.fly.dev"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
